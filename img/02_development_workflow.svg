<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 560" width="1200" height="560" fill="#1d2733" role="img" aria-label="Development workflow">
<title>Development workflow</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker><marker id="k1d2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="1200" height="560" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Development workflow</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">From C source to tested hardware, with simulation before any board is built</text>
<circle cx="122" cy="128" r="12" fill="#1f3a5f"/>
<text x="122" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<rect x="40" y="150" width="164" height="110" rx="8" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="122" y="190.4" font-size="15" fill="#1f3a5f" font-weight="700" text-anchor="middle">Write firmware</text>
<text x="122" y="214" font-size="12.5" text-anchor="middle">mikroC (C for PIC)</text>
<text x="122" y="230.9" font-size="12.5" text-anchor="middle">peripheral libraries</text>
<line x1="206" y1="205" x2="226" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="310" cy="128" r="12" fill="#1f3a5f"/>
<text x="310" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<rect x="228" y="150" width="164" height="110" rx="8" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="310" y="190.4" font-size="15" fill="#1f3a5f" font-weight="700" text-anchor="middle">Compile</text>
<text x="310" y="214" font-size="12.5" text-anchor="middle">HEX file +</text>
<text x="310" y="230.9" font-size="12.5" text-anchor="middle">config bits</text>
<line x1="394" y1="205" x2="414" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="498" cy="128" r="12" fill="#0b7a83"/>
<text x="498" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<rect x="416" y="150" width="164" height="110" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="498" y="190.4" font-size="15" fill="#0b7a83" font-weight="700" text-anchor="middle">Simulate</text>
<text x="498" y="214" font-size="12.5" text-anchor="middle">Proteus: MCU model,</text>
<text x="498" y="230.9" font-size="12.5" text-anchor="middle">virtual LCD, scope</text>
<line x1="582" y1="205" x2="602" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="686" cy="128" r="12" fill="#0b7a83"/>
<text x="686" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<rect x="604" y="150" width="164" height="110" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="686" y="190.4" font-size="15" fill="#0b7a83" font-weight="700" text-anchor="middle">Program the chip</text>
<text x="686" y="214" font-size="12.5" text-anchor="middle">device programmer</text>
<text x="686" y="230.9" font-size="12.5" text-anchor="middle">or ICSP</text>
<line x1="770" y1="205" x2="790" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="874" cy="128" r="12" fill="#b86e00"/>
<text x="874" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<rect x="792" y="150" width="164" height="110" rx="8" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.5"/>
<text x="874" y="190.4" font-size="15" fill="#b86e00" font-weight="700" text-anchor="middle">Build hardware</text>
<text x="874" y="214" font-size="12.5" text-anchor="middle">breadboard / PCB,</text>
<text x="874" y="230.9" font-size="12.5" text-anchor="middle">sensors, drivers</text>
<line x1="958" y1="205" x2="978" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="1062" cy="128" r="12" fill="#2e7d4f"/>
<text x="1062" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">6</text>
<rect x="980" y="150" width="164" height="110" rx="8" fill="#e6f3ea" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="1062" y="190.4" font-size="15" fill="#2e7d4f" font-weight="700" text-anchor="middle">Test &amp; validate</text>
<text x="1062" y="214" font-size="12.5" text-anchor="middle">functional checks,</text>
<text x="1062" y="230.9" font-size="12.5" text-anchor="middle">measurements</text>
<path d="M 498 262 V 312 H 140 V 266" fill="none" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#kb3261e)"/>
<text x="319" y="304" font-size="13.5" fill="#b3261e" font-weight="600" text-anchor="middle">Fault found in simulation: fix the code</text>
<path d="M 1062 262 V 382 H 104 V 266" fill="none" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#kb3261e)"/>
<text x="583" y="374" font-size="13.5" fill="#b3261e" font-weight="600" text-anchor="middle">Fault found on hardware: debug, then fix code or wiring</text>
<rect x="40" y="450" width="1120" height="70" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="480" font-size="14" fill="#1f3a5f" font-weight="700">Why simulate first:</text>
<text x="222" y="480" font-size="14">timing, display output and logic errors show up in Proteus, so the board is only built once the firmware behaves.</text>
<text x="60" y="504" font-size="14" fill="#5b6b7c">Hardware testing then covers what simulation cannot: real sensor noise, power supply and wiring.</text>
<text x="1160" y="544" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Embedded Systems, IoT &amp; Industrial Automation</text>
</svg>