<rect x="708" y="244" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="740" y="244" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="772" y="244" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="708" y="252" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
