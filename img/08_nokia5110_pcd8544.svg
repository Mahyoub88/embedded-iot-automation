<rect x="772" y="252" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="708" y="260" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="740" y="260" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="764" y="260" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="772" y="260" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="780" y="260" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<text x="820" y="244" font-size="12" font-weight="500">text drawn from a 5 × 7 font table</text>
<line x1="396" y1="140" x2="396" y2="524" stroke="#5b6b7c" stroke-width="1.2"/>
<text x="390" y="332" font-size="12.5" fill="#5b6b7c" font-weight="600" text-anchor="end">48</text>
<text x="756" y="564" font-size="12.5" fill="#5b6b7c" font-weight="600" text-anchor="middle">84 columns</text>
<rect x="40" y="600" width="1120" height="130" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="630" font-size="16" fill="#1f3a5f" font-weight="700">How a frame is drawn</text>
<text x="60" y="656" font-size="13.5">1. With DC = 0, send set-X (0–83) and set-bank (0–5) commands.   2. With DC = 1, send data bytes; X advances automatically.</text>
<text x="60" y="680" font-size="13.5">6 banks × 84 bytes = 504 bytes per screen, more than a PIC16 has in RAM, so text is written straight to the panel position by position.</text>
<text x="60" y="704" font-size="13.5">The panel runs at 3.3 V: a 5 V PIC drives it through level shifting or series resistors on the signal lines.</text>
<text x="1160" y="756" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Embedded Systems, IoT &amp; Industrial Automation</text>
