<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772" fill="#1d2733" role="img" aria-label="Nokia 5110 graphic LCD (PCD8544)">
<title>Nokia 5110 graphic LCD (PCD8544)</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker><marker id="k1d2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="1200" height="772" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Nokia 5110 graphic LCD (PCD8544)</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">84 × 48 pixels written as bytes, each byte filling a vertical strip of 8 pixels</text>
<rect x="40" y="120" width="300" height="300" rx="10" fill="#e8eef6" stroke="#1f3a5f" stroke-width="2"/>
<text x="190" y="150" font-size="15" fill="#1f3a5f" font-weight="700" text-anchor="middle">PIC16 → LCD</text>
<rect x="56" y="178" width="74" height="28" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="93" y="197" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle" class="m">RST</text>
<text x="140" y="197" font-size="12">reset, low pulse at start</text>
<rect x="56" y="216" width="74" height="28" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="93" y="235" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle" class="m">CE</text>
<text x="140" y="235" font-size="12">chip enable, active low</text>
<rect x="56" y="254" width="74" height="28" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="93" y="273" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle" class="m">DC</text>
<text x="140" y="273" font-size="12">0 = command, 1 = data</text>
<rect x="56" y="292" width="74" height="28" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="93" y="311" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle" class="m">DIN</text>
<text x="140" y="311" font-size="12">serial data, MSB first</text>
<rect x="56" y="330" width="74" height="28" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="93" y="349" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle" class="m">CLK</text>
<text x="140" y="349" font-size="12">serial clock</text>
<rect x="56" y="368" width="74" height="28" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.2"/>
<text x="93" y="387" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="middle" class="m">VCC / BL</text>
<text x="140" y="387" font-size="12">3.3 V, backlight</text>
<rect x="404" y="124" width="704" height="416" rx="10" fill="#cfd8c4" stroke="#1d2733" stroke-width="2"/>
<rect x="420" y="140" width="672" height="64" rx="0" fill="#dfe7d3" stroke="none" stroke-width="0"/>
<text x="1118" y="176" font-size="12.5" fill="#1f3a5f" font-weight="600">bank 0</text>
<rect x="420" y="204" width="672" height="64" rx="0" fill="#d3dcc6" stroke="none" stroke-width="0"/>
<text x="1118" y="240" font-size="12.5" fill="#1f3a5f" font-weight="600">bank 1</text>
<rect x="420" y="268" width="672" height="64" rx="0" fill="#dfe7d3" stroke="none" stroke-width="0"/>
<text x="1118" y="304" font-size="12.5" fill="#1f3a5f" font-weight="600">bank 2</text>
<rect x="420" y="332" width="672" height="64" rx="0" fill="#d3dcc6" stroke="none" stroke-width="0"/>
<text x="1118" y="368" font-size="12.5" fill="#1f3a5f" font-weight="600">bank 3</text>
<rect x="420" y="396" width="672" height="64" rx="0" fill="#dfe7d3" stroke="none" stroke-width="0"/>
<text x="1118" y="432" font-size="12.5" fill="#1f3a5f" font-weight="600">bank 4</text>
<rect x="420" y="460" width="672" height="64" rx="0" fill="#d3dcc6" stroke="none" stroke-width="0"/>
<text x="1118" y="496" font-size="12.5" fill="#1f3a5f" font-weight="600">bank 5</text>
<rect x="500" y="268" width="8" height="64" rx="0" fill="#0b7a83" stroke="#0b7a83" stroke-width="0"/>
<line x1="504" y1="340" x2="504" y2="402" stroke="#0b7a83" stroke-width="1.6" marker-end="url(#k0b7a83)"/>
<text x="514" y="402" font-size="12.5" fill="#0b7a83" font-weight="700">one data byte = x 10, bank 2</text>
<rect x="708" y="212" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
<rect x="740" y="212" width="7" height="7" rx="0" fill="#2b3a2a" stroke="none" stroke-width="0"/>
