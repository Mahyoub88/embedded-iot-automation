<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 930" role="img" aria-labelledby="title desc"><title id="title">Pin assignment and connector map</title><desc id="desc">Reference pin map for PIC16F877A in the 40-pin DIP package; verify package and board before assembly.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087f8c"/></marker></defs><rect width="1400" height="930" rx="24" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="48" y="52" font-size="14" font-weight="700" fill="#087f8c">EQUIPMENT ROOM · REFERENCE DESIGN</text><text x="48" y="101" font-size="32" font-weight="700" fill="#122b47">Pin assignment and connector map</text><text x="48" y="136" font-size="17" fill="#52657a">Reference pin map for PIC16F877A in the 40-pin DIP package; verify package and board before assembly.</text><rect x="48" y="180" width="1304" height="54" fill="#dcecf0"/><text x="65" y="214" font-size="18" fill="#122b47">PIC signal</text><text x="310" y="214" font-size="18" fill="#122b47">DIP-40 pin</text><text x="460" y="214" font-size="18" fill="#122b47">Connection</text><text x="930" y="214" font-size="18" fill="#122b47">Design note</text><rect x="48" y="234" width="1304" height="43" fill="#fff"/><text x="65" y="262" font-size="16" fill="#122b47">AN0 / RA0</text><text x="310" y="262" font-size="16" fill="#122b47">2</text><text x="460" y="262" font-size="16" fill="#122b47">LM35 analog output</text><text x="930" y="262" font-size="16" fill="#122b47">0–1 V for 0–100°C</text><rect x="48" y="277" width="1304" height="43" fill="#edf3f8"/><text x="65" y="305" font-size="16" fill="#122b47">RA1</text><text x="310" y="305" font-size="16" fill="#122b47">3</text><text x="460" y="305" font-size="16" fill="#122b47">Exit request, active low</text><text x="930" y="305" font-size="16" fill="#122b47">10 kΩ pull-up; button to GND</text><rect x="48" y="320" width="1304" height="43" fill="#fff"/><text x="65" y="348" font-size="16" fill="#122b47">RA2</text><text x="310" y="348" font-size="16" fill="#122b47">4</text><text x="460" y="348" font-size="16" fill="#122b47">Alarm acknowledge, active low</text><text x="930" y="348" font-size="16" fill="#122b47">10 kΩ pull-up; button to GND</text><rect x="48" y="363" width="1304" height="43" fill="#edf3f8"/><text x="65" y="391" font-size="16" fill="#122b47">RB0–RB3</text><text x="310" y="391" font-size="16" fill="#122b47">33–36</text><text x="460" y="391" font-size="16" fill="#122b47">Keypad rows R1–R4</text><text x="930" y="391" font-size="16" fill="#122b47">One row low; others high-Z</text><rect x="48" y="406" width="1304" height="43" fill="#fff"/><text x="65" y="434" font-size="16" fill="#122b47">RB4–RB7</text><text x="310" y="434" font-size="16" fill="#122b47">37–40</text><text x="460" y="434" font-size="16" fill="#122b47">Keypad columns C1–C4</text><text x="930" y="434" font-size="16" fill="#122b47">Pull-ups enabled; debounce</text><rect x="48" y="449" width="1304" height="43" fill="#edf3f8"/><text x="65" y="477" font-size="16" fill="#122b47">RC3 / RC4</text><text x="310" y="477" font-size="16" fill="#122b47">18 / 23</text><text x="460" y="477" font-size="16" fill="#122b47">I²C SCL / SDA</text><text x="930" y="477" font-size="16" fill="#122b47">100 kHz; pull-ups to +5 V</text><rect x="48" y="492" width="1304" height="43" fill="#fff"/><text x="65" y="520" font-size="16" fill="#122b47">RD0–RD3</text><text x="310" y="520" font-size="16" fill="#122b47">19–22</text><text x="460" y="520" font-size="16" fill="#122b47">LCD D4–D7</text><text x="930" y="520" font-size="16" fill="#122b47">LCD RW → GND</text><rect x="48" y="535" width="1304" height="43" fill="#edf3f8"/><text x="65" y="563" font-size="16" fill="#122b47">RD4 / RD5</text><text x="310" y="563" font-size="16" fill="#122b47">27 / 28</text><text x="460" y="563" font-size="16" fill="#122b47">LCD RS / EN</text><text x="930" y="563" font-size="16" fill="#122b47">4-bit interface</text><rect x="48" y="578" width="1304" height="43" fill="#fff"/><text x="65" y="606" font-size="16" fill="#122b47">RD6</text><text x="310" y="606" font-size="16" fill="#122b47">29</text><text x="460" y="606" font-size="16" fill="#122b47">Door contact</text><text x="930" y="606" font-size="16" fill="#122b47">NC closed to GND = door closed</text><rect x="48" y="621" width="1304" height="43" fill="#edf3f8"/><text x="65" y="649" font-size="16" fill="#122b47">RC0 / RC1 / RC2</text><text x="310" y="649" font-size="16" fill="#122b47">15 / 16 / 17</text><text x="460" y="649" font-size="16" fill="#122b47">Fan / unlock / buzzer</text><text x="930" y="649" font-size="16" fill="#122b47">External drivers; active high</text><rect x="48" y="664" width="1304" height="43" fill="#fff"/><text x="65" y="692" font-size="16" fill="#122b47">RC5</text><text x="310" y="692" font-size="16" fill="#122b47">24</text><text x="460" y="692" font-size="16" fill="#122b47">Status LED</text><text x="930" y="692" font-size="16" fill="#122b47">Series resistor</text><rect x="48" y="707" width="1304" height="43" fill="#edf3f8"/><text x="65" y="735" font-size="16" fill="#122b47">RC6 / RC7</text><text x="310" y="735" font-size="16" fill="#122b47">25 / 26</text><text x="460" y="735" font-size="16" fill="#122b47">Reserved serial debug</text><text x="930" y="735" font-size="16" fill="#122b47">Not required for baseline</text><text x="48" y="800" font-size="18" fill="#122b47">Power: VDD pins 11,32 → +5 V; VSS pins 12,31 → GND. MCLR pin 1 → 10 kΩ pull-up.</text><text x="48" y="832" font-size="18" fill="#122b47">OSC1/OSC2 pins 13/14 → 8 MHz crystal network. ICSP: MCLR, RB6, RB7, VDD, VSS.</text><text x="48" y="864" font-size="18" fill="#122b47">Disable LVP for RB3 keypad use. Disconnect keypad columns from RB6/RB7 during ICSP.</text><text x="48" y="902" font-size="15" fill="#52657a">New engineering documentation · proposed integrated design · original implementation media preserved separately</text></g></svg>