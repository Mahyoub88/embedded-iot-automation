<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 780" role="img" aria-labelledby="title desc"><title id="title">Persistent settings and power interruption</title><desc id="desc">A proposed dual-slot record replaces repeated writes; original EEPROM media remains in the evidence gallery.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087f8c"/></marker></defs><rect width="1400" height="780" rx="24" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="48" y="52" font-size="14" font-weight="700" fill="#087f8c">EQUIPMENT ROOM · REFERENCE DESIGN</text><text x="48" y="101" font-size="32" font-weight="700" fill="#122b47">Persistent settings and power interruption</text><text x="48" y="136" font-size="17" fill="#52657a">A proposed dual-slot record replaces repeated writes; original EEPROM media remains in the evidence gallery.</text><rect x="48" y="200" width="590" height="155" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="234" font-size="21" fill="#122b47">Slot A · addresses 0x00–0x1F</text><text x="68" y="265" font-size="16" fill="#52657a">0: magic; 1: format version; 2–3: sequence</text><text x="68" y="291" font-size="16" fill="#52657a">4–23: payload; 24–25: CRC16</text><text x="68" y="317" font-size="16" fill="#52657a">31: commit byte 0xA5</text><rect x="760" y="200" width="590" height="155" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="780" y="234" font-size="21" fill="#122b47">Slot B · addresses 0x20–0x3F</text><text x="780" y="265" font-size="16" fill="#52657a">Same layout; inactive slot written first</text><text x="780" y="291" font-size="16" fill="#52657a">Validate ranges and CRC before use</text><text x="780" y="317" font-size="16" fill="#52657a">Choose newest valid modular sequence</text><rect x="48" y="430" width="270" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="464" font-size="21" fill="#122b47">1 · INVALIDATE</text><text x="68" y="495" font-size="16" fill="#52657a">Commit byte → 0x00</text><text x="68" y="521" font-size="16" fill="#52657a">Preserve active slot</text><rect x="395" y="430" width="270" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="415" y="464" font-size="21" fill="#122b47">2 · WRITE</text><text x="415" y="495" font-size="16" fill="#52657a">Header + payload + CRC</text><text x="415" y="521" font-size="16" fill="#52657a">Read back and validate</text><rect x="742" y="430" width="270" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="762" y="464" font-size="21" fill="#122b47">3 · COMMIT</text><text x="762" y="495" font-size="16" fill="#52657a">Commit byte → 0xA5</text><text x="762" y="521" font-size="16" fill="#52657a">Write this byte last</text><rect x="1085" y="430" width="270" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="1105" y="464" font-size="21" fill="#122b47">4 · RESTORE</text><text x="1105" y="495" font-size="16" fill="#52657a">Choose valid slot</text><text x="1105" y="521" font-size="16" fill="#52657a">Else use defaults</text><path d="M318 503H395" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M665 503H742" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M1012 503H1085" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="48" y="662" font-size="19" fill="#122b47">Write only on explicit confirmed changes. Keep credentials out of logs. Leave 0x40–0xFF reserved.</text><text x="48" y="698" font-size="19" fill="#122b47">The tested model injects interruption at every byte boundary; real brownout validation remains required.</text><text x="48" y="752" font-size="15" fill="#52657a">New engineering documentation · proposed integrated design · original implementation media preserved separately</text></g></svg>