<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img"><title>Fan and lock MOSFET driver reference circuit</title><desc>Low-side logic-level N-MOSFET with gate resistor, pull-down and inductive-load flyback diode. Component ratings depend on selected load.</desc><rect width="1400" height="800" rx="24" fill="#f5f8fc"/><g font-family="Arial,sans-serif" fill="#122b47"><text x="48" y="52" font-size="14" fill="#087f8c">EQUIPMENT ROOM · REFERENCE CIRCUIT</text><text x="48" y="100" font-size="32">Fan / lock low-side driver circuit</text><text x="48" y="138" font-size="17">Repeat for RC0 fan and RC1 lock. Diagram uses a generic logic-level MOSFET; select the actual part.</text><g stroke="#087f8c" stroke-width="3" fill="none"><path d="M830 205V240H1100V260M830 240V265"/><rect x="798" y="265" width="64" height="105"/><path d="M830 370V445M830 445H1100V345M1100 260V285"/><path d="M1078 285H1122M1078 325L1100 285L1122 325Z"/><path d="M1100 325V345"/><path d="M135 480H270M335 480H700"/><rect x="270" y="466" width="65" height="28"/><path d="M580 480V550M580 625V665H830V590"/><rect x="566" y="550" width="28" height="75"/><path d="M700 435V535M730 435V535M730 450H830V445M730 520H830V590M735 500H785L767 488M785 500L767 512"/><path d="M830 665V700M795 700H865M803 713H857M817 726H843"/></g><circle cx="830" cy="240" r="5" fill="#087f8c"/><circle cx="830" cy="445" r="5" fill="#087f8c"/><circle cx="580" cy="480" r="5" fill="#087f8c"/><circle cx="830" cy="665" r="5" fill="#087f8c"/><text x="786" y="190" font-size="20">FUSED +12 V</text><text x="895" y="303" font-size="21">DC load</text><text x="895" y="332" font-size="16">Fan / lock / relay coil</text><text x="1140" y="284" font-size="18">Flyback diode</text><text x="1140" y="312" font-size="16">Cathode → +12 V</text><text x="1140" y="340" font-size="16">Anode → drain</text><text x="48" y="454" font-size="19">PIC RC0 / RC1</text><text x="268" y="447" font-size="18">100 Ω</text><text x="457" y="591" font-size="18">100 kΩ</text><text x="857" y="505" font-size="21">Q: N-MOSFET</text><text x="857" y="538" font-size="16">RDS(on) rated at VGS = 5 V</text><text x="686" y="567" font-size="17">Gate</text><text x="843" y="418" font-size="17">Drain</text><text x="843" y="609" font-size="17">Source</text><text x="878" y="700" font-size="18">COMMON GND</text><text x="48" y="760" font-size="16" fill="#52657a">Validate load current/inrush, MOSFET dissipation, diode rating and turn-off time. Low-voltage prototype only.</text></g></svg>