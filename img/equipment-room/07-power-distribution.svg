<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc"><title id="title">Power distribution and reset</title><desc id="desc">Baseline uses external low-voltage DC supply, separate logic and load branches.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087f8c"/></marker></defs><rect width="1400" height="800" rx="24" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="48" y="52" font-size="14" font-weight="700" fill="#087f8c">EQUIPMENT ROOM · REFERENCE DESIGN</text><text x="48" y="101" font-size="32" font-weight="700" fill="#122b47">Power distribution and reset</text><text x="48" y="136" font-size="17" fill="#52657a">Baseline uses external low-voltage DC supply, separate logic and load branches.</text><rect x="48" y="220" width="300" height="150" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="254" font-size="21" fill="#122b47">12 V DC input</text><text x="68" y="285" font-size="16" fill="#52657a">Fused input</text><text x="68" y="311" font-size="16" fill="#52657a">Reverse-polarity protection</text><rect x="510" y="190" width="360" height="150" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="530" y="224" font-size="21" fill="#122b47">Load branch</text><text x="530" y="255" font-size="16" fill="#52657a">Fan / lock driver channels</text><text x="530" y="281" font-size="16" fill="#52657a">Separate load-return wiring</text><rect x="510" y="420" width="360" height="150" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="530" y="454" font-size="21" fill="#122b47">5 V regulated logic</text><text x="530" y="485" font-size="16" fill="#52657a">Buck converter sized to load</text><text x="530" y="511" font-size="16" fill="#52657a">PIC + LCD + LM35 + I²C</text><rect x="1030" y="190" width="320" height="150" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="1050" y="224" font-size="21" fill="#122b47">Reset / programming</text><text x="1050" y="255" font-size="16" fill="#52657a">MCLR pull-up; ICSP header</text><text x="1050" y="281" font-size="16" fill="#52657a">Brownout enabled</text><rect x="1030" y="420" width="320" height="150" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="1050" y="454" font-size="21" fill="#122b47">Local bypass</text><text x="1050" y="485" font-size="16" fill="#52657a">100 nF at each IC supply</text><text x="1050" y="511" font-size="16" fill="#52657a">Bulk capacitor at board entry</text><path d="M348 285H425V260H510" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="380" y="244" font-size="15" fill="#087f8c">12 V</text><path d="M425 285V495H510" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="377" y="398" font-size="15" fill="#087f8c">DC conversion</text><path d="M870 495H1030" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="932" y="478" font-size="15" fill="#087f8c">5 V</text><path d="M870 260H1030" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="884" y="242" font-size="15" fill="#087f8c">Common reference</text><text x="48" y="682" font-size="19" fill="#122b47">DS1307: 32.768 kHz crystal and suitable backup battery; do not charge a non-rechargeable cell.</text><text x="48" y="720" font-size="19" fill="#122b47">I²C: one effective pull-up pair, short wiring. Check module regulators, pull-ups and logic voltage.</text><text x="48" y="772" font-size="15" fill="#52657a">New engineering documentation · proposed integrated design · original implementation media preserved separately</text></g></svg>