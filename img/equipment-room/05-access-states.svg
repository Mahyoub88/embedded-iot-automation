<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc"><title id="title">Access-control state machine</title><desc id="desc">Local code lock for a low-voltage prototype; not a certified security or emergency-egress controller.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087f8c"/></marker></defs><rect width="1400" height="790" rx="24" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="48" y="52" font-size="14" font-weight="700" fill="#087f8c">EQUIPMENT ROOM · REFERENCE DESIGN</text><text x="48" y="101" font-size="32" font-weight="700" fill="#122b47">Access-control state machine</text><text x="48" y="136" font-size="17" fill="#52657a">Local code lock for a low-voltage prototype; not a certified security or emergency-egress controller.</text><rect x="48" y="200" width="350" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="234" font-size="21" fill="#122b47">LOCKED</text><text x="68" y="265" font-size="16" fill="#52657a">Mask PIN entry</text><text x="68" y="291" font-size="16" fill="#52657a">Exit button may request release</text><rect x="525" y="200" width="350" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="545" y="234" font-size="21" fill="#122b47">UNLOCK PULSE</text><text x="545" y="265" font-size="16" fill="#52657a">Valid credential → 5 s pulse</text><text x="545" y="291" font-size="16" fill="#52657a">Return LOCKED on deadline</text><path d="M398 264H525" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="417" y="244" font-size="15" fill="#087f8c">Valid PIN / exit</text><path d="M700 345V395H225V345" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="400" y="382" font-size="15" fill="#087f8c">Pulse expires</text><rect x="48" y="480" width="350" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="514" font-size="21" fill="#122b47">FAILED ATTEMPT</text><text x="68" y="545" font-size="16" fill="#52657a">Increment failed count</text><text x="68" y="571" font-size="16" fill="#52657a">3 failures → lockout</text><rect x="525" y="480" width="350" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="545" y="514" font-size="21" fill="#122b47">LOCKOUT</text><text x="545" y="545" font-size="16" fill="#52657a">30 s keypad inhibit</text><text x="545" y="571" font-size="16" fill="#52657a">Exit request remains available</text><rect x="1000" y="480" width="350" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="1020" y="514" font-size="21" fill="#122b47">DOOR ALARM</text><text x="1020" y="545" font-size="16" fill="#52657a">Unauthorized opening</text><text x="1020" y="571" font-size="16" fill="#52657a">Open longer than 30 s</text><path d="M225 345V480" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="242" y="432" font-size="15" fill="#087f8c">Wrong PIN</text><path d="M398 548H525" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="413" y="530" font-size="15" fill="#087f8c">Third failure</text><path d="M700 480V425H435V170H225V200" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="455" y="411" font-size="15" fill="#087f8c">Lockout ends → LOCKED</text><rect x="1000" y="200" width="350" height="145" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="1020" y="234" font-size="21" fill="#122b47">DOOR MONITOR</text><text x="1020" y="265" font-size="16" fill="#52657a">NC contact closed = secure</text><text x="1020" y="291" font-size="16" fill="#52657a">5 s reclose grace after pulse</text><text x="48" y="710" font-size="19" fill="#122b47">PIN storage is not encryption. Power cycling clears reference lockout; stronger security is an extension.</text><text x="48" y="762" font-size="15" fill="#52657a">New engineering documentation · proposed integrated design · original implementation media preserved separately</text></g></svg>