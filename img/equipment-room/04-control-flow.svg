<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 790" role="img" aria-labelledby="title desc"><title id="title">Firmware schedule and fault handling</title><desc id="desc">The timing interrupt maintains a tick; slow sensing, LCD updates and storage run in foreground.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087f8c"/></marker></defs><rect width="1400" height="790" rx="24" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="48" y="52" font-size="14" font-weight="700" fill="#087f8c">EQUIPMENT ROOM · REFERENCE DESIGN</text><text x="48" y="101" font-size="32" font-weight="700" fill="#122b47">Firmware schedule and fault handling</text><text x="48" y="136" font-size="17" fill="#52657a">The timing interrupt maintains a tick; slow sensing, LCD updates and storage run in foreground.</text><rect x="48" y="200" width="310" height="130" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="234" font-size="21" fill="#122b47">BOOT / VALIDATE</text><text x="68" y="265" font-size="16" fill="#52657a">Outputs de-energized</text><text x="68" y="291" font-size="16" fill="#52657a">Load valid settings or defaults</text><rect x="535" y="200" width="310" height="130" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="555" y="234" font-size="21" fill="#122b47">SCAN / ACQUIRE</text><text x="555" y="265" font-size="16" fill="#52657a">Keypad and door debounce</text><text x="555" y="291" font-size="16" fill="#52657a">ADC + I²C sensor deadline</text><rect x="1020" y="200" width="330" height="130" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="1040" y="234" font-size="21" fill="#122b47">DECIDE / APPLY</text><text x="1040" y="265" font-size="16" fill="#52657a">Cooling hysteresis</text><text x="1040" y="291" font-size="16" fill="#52657a">Access + alarm states</text><path d="M358 265H535" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><path d="M845 265H1020" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><rect x="48" y="440" width="400" height="180" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="474" font-size="21" fill="#122b47">Temperature invalid / stale</text><text x="68" y="505" font-size="16" fill="#52657a">Fan command ON</text><text x="68" y="531" font-size="16" fill="#52657a">Temperature fault alarm</text><text x="68" y="557" font-size="16" fill="#52657a">Require wiring/measurement check</text><rect x="500" y="440" width="400" height="180" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="520" y="474" font-size="21" fill="#122b47">Humidity / RTC unavailable</text><text x="520" y="505" font-size="16" fill="#52657a">Flag humidity / clock fault</text><text x="520" y="531" font-size="16" fill="#52657a">Humidity fault: no invented value</text><text x="520" y="557" font-size="16" fill="#52657a">RTC failure: time restrictions deny</text><rect x="952" y="440" width="400" height="180" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="972" y="474" font-size="21" fill="#122b47">Sensor and state recovery</text><text x="972" y="505" font-size="16" fill="#52657a">Use fresh validated sample</text><text x="972" y="531" font-size="16" fill="#52657a">Re-evaluate alarm and outputs</text><text x="972" y="557" font-size="16" fill="#52657a">Keep active fault indication</text><path d="M1185 330V385H200V440" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="540" y="373" font-size="15" fill="#087f8c">Next foreground cycle / fault branch</text><text x="48" y="710" font-size="19" fill="#122b47">Acknowledge silences the buzzer only; active fault indicators remain. No blocking unlock delays.</text><text x="48" y="762" font-size="15" fill="#52657a">New engineering documentation · proposed integrated design · original implementation media preserved separately</text></g></svg>