<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 730" role="img" aria-labelledby="title desc"><title id="title">System architecture</title><desc id="desc">Local monitoring, ventilation, access and persistent settings; no cloud connection is assumed.</desc><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0 0L8 4L0 8" fill="#087f8c"/></marker></defs><rect width="1400" height="730" rx="24" fill="#f5f8fc"/><g font-family="Arial,sans-serif"><text x="48" y="52" font-size="14" font-weight="700" fill="#087f8c">EQUIPMENT ROOM · REFERENCE DESIGN</text><text x="48" y="101" font-size="32" font-weight="700" fill="#122b47">System architecture</text><text x="48" y="136" font-size="17" fill="#52657a">Local monitoring, ventilation, access and persistent settings; no cloud connection is assumed.</text><rect x="48" y="190" width="330" height="130" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="224" font-size="21" fill="#122b47">Environmental inputs</text><text x="68" y="255" font-size="16" fill="#52657a">LM35 → AN0 (temperature)</text><text x="68" y="281" font-size="16" fill="#52657a">SHT31 → I²C (humidity)</text><rect x="48" y="360" width="330" height="130" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="68" y="394" font-size="21" fill="#122b47">User and door inputs</text><text x="68" y="425" font-size="16" fill="#52657a">4×4 keypad → PORTB</text><text x="68" y="451" font-size="16" fill="#52657a">Door / exit / acknowledge</text><rect x="510" y="220" width="380" height="240" rx="12" fill="#e9f5f5" stroke="#a9bfce" stroke-width="2"/><text x="530" y="254" font-size="21" fill="#122b47">PIC16F877A controller</text><text x="530" y="285" font-size="16" fill="#52657a">Acquire → validate → control</text><text x="530" y="311" font-size="16" fill="#52657a">Non-blocking state machines</text><text x="530" y="337" font-size="16" fill="#52657a">Internal EEPROM: settings</text><text x="530" y="363" font-size="16" fill="#52657a">LCD + local alarm status</text><rect x="1020" y="190" width="330" height="130" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="1040" y="224" font-size="21" fill="#122b47">Actuator outputs</text><text x="1040" y="255" font-size="16" fill="#52657a">MOSFET / relay drivers</text><text x="1040" y="281" font-size="16" fill="#52657a">12 V fan and lock, local buzzer</text><rect x="1020" y="360" width="330" height="130" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="1040" y="394" font-size="21" fill="#122b47">Operator interface</text><text x="1040" y="425" font-size="16" fill="#52657a">16×2 LCD in 4-bit mode</text><text x="1040" y="451" font-size="16" fill="#52657a">Status and fault messages</text><rect x="510" y="540" width="380" height="115" rx="12" fill="#fff" stroke="#a9bfce" stroke-width="2"/><text x="530" y="574" font-size="21" fill="#122b47">DS1307 RTC</text><text x="530" y="605" font-size="16" fill="#52657a">I²C clock with backup battery</text><path d="M378 250H510" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="395" y="238" font-size="15" fill="#087f8c">ADC / I²C</text><path d="M378 420H450V350H510" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="390" y="402" font-size="15" fill="#087f8c">GPIO</text><path d="M890 280H950V250H1020" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="920" y="233" font-size="15" fill="#087f8c">GPIO → drivers</text><path d="M890 390H1020" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="930" y="377" font-size="15" fill="#087f8c">LCD</text><path d="M700 540V460" stroke="#087f8c" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="718" y="505" font-size="15" fill="#087f8c">I²C</text><text x="48" y="702" font-size="15" fill="#52657a">New engineering documentation · proposed integrated design · original implementation media preserved separately</text></g></svg>