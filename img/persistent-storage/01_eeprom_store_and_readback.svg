<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" fill="#1d2733" role="img" aria-label="How data is stored and read back">
<title>How data is stored and read back</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker></defs>
<rect width="1200" height="800" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">How data is stored and read back</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Write, verify, survive a power cut, read at start-up: the cycle the firmware follows</text>
<circle cx="140" cy="128" r="12" fill="#1f3a5f"/>
<text x="140" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">1</text>
<rect x="40" y="150" width="200" height="110" rx="8" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="140" y="190.7" font-size="16" fill="#1f3a5f" font-weight="700" text-anchor="middle">Input</text>
<text x="140" y="214.3" font-size="12.5" text-anchor="middle">value entered or</text>
<text x="140" y="231.2" font-size="12.5" text-anchor="middle">measured</text>
<line x1="242" y1="205" x2="266" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="368" cy="128" r="12" fill="#b86e00"/>
<text x="368" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">2</text>
<rect x="268" y="150" width="200" height="110" rx="8" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.5"/>
<text x="368" y="190.7" font-size="16" fill="#b86e00" font-weight="700" text-anchor="middle">Write</text>
<text x="368" y="214.3" font-size="12.5" text-anchor="middle">EEPROM_Write(addr, data)</text>
<text x="368" y="231.2" font-size="12.5" text-anchor="middle">one byte per address</text>
<line x1="470" y1="205" x2="494" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="596" cy="128" r="12" fill="#b86e00"/>
<text x="596" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">3</text>
<rect x="496" y="150" width="200" height="110" rx="8" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.5"/>
<text x="596" y="190.7" font-size="16" fill="#b86e00" font-weight="700" text-anchor="middle">Wait</text>
<text x="596" y="214.3" font-size="12.5" text-anchor="middle">write takes a few ms;</text>
<text x="596" y="231.2" font-size="12.5" text-anchor="middle">no new write until done</text>
<line x1="698" y1="205" x2="722" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="824" cy="128" r="12" fill="#0b7a83"/>
<text x="824" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">4</text>
<rect x="724" y="150" width="200" height="110" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="824" y="190.7" font-size="16" fill="#0b7a83" font-weight="700" text-anchor="middle">Verify</text>
<text x="824" y="214.3" font-size="12.5" text-anchor="middle">EEPROM_Read(addr)</text>
<text x="824" y="231.2" font-size="12.5" text-anchor="middle">must equal data</text>
<line x1="926" y1="205" x2="950" y2="205" stroke="#5b6b7c" stroke-width="2" marker-end="url(#k5b6b7c)"/>
<circle cx="1052" cy="128" r="12" fill="#2e7d4f"/>
<text x="1052" y="132.5" font-size="12.5" fill="#ffffff" font-weight="700" text-anchor="middle">5</text>
<rect x="952" y="150" width="200" height="110" rx="8" fill="#e6f3ea" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="1052" y="190.7" font-size="16" fill="#2e7d4f" font-weight="700" text-anchor="middle">Display</text>
<text x="1052" y="214.3" font-size="12.5" text-anchor="middle">value and status</text>
<text x="1052" y="231.2" font-size="12.5" text-anchor="middle">shown on the LCD</text>
<path d="M 824 262 V 300 H 368 V 264" fill="none" stroke="#b3261e" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#kb3261e)"/>
<text x="596" y="292" font-size="13" fill="#b3261e" font-weight="600" text-anchor="middle">mismatch: write again, then report an error</text>
<rect x="40" y="340" width="560" height="190" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="370" font-size="16" fill="#1f3a5f" font-weight="700">After a power cut</text>
<text x="60" y="398" font-size="14">Data EEPROM is non-volatile: the bytes stay</text>
<text x="60" y="422" font-size="14">when power is removed. At start-up the firmware</text>
<text x="60" y="446" font-size="14">reads the stored addresses back and restores</text>
<text x="60" y="470" font-size="14">the last values before normal operation.</text>
<rect x="620" y="340" width="540" height="190" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="640" y="370" font-size="16" fill="#1f3a5f" font-weight="700">Address map (example layout)</text>
<rect x="640" y="388" width="500" height="28" rx="4" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1"/>
<text x="656" y="407" font-size="13" fill="#0b7a83" font-weight="700" class="m">0x00</text>
<text x="800" y="407" font-size="13">record count</text>
<rect x="640" y="422" width="500" height="28" rx="4" fill="#ffffff" stroke="#0b7a83" stroke-width="1"/>
<text x="656" y="441" font-size="13" fill="#0b7a83" font-weight="700" class="m">0x01 – 0x0F</text>
<text x="800" y="441" font-size="13">stored values</text>
<rect x="640" y="456" width="500" height="28" rx="4" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1"/>
<text x="656" y="475" font-size="13" fill="#0b7a83" font-weight="700" class="m">0x10</text>
<text x="800" y="475" font-size="13">checksum</text>
<rect x="640" y="490" width="500" height="28" rx="4" fill="#ffffff" stroke="#0b7a83" stroke-width="1"/>
<text x="656" y="509" font-size="13" fill="#0b7a83" font-weight="700" class="m">rest</text>
<text x="800" y="509" font-size="13">free</text>
<rect x="40" y="560" width="1120" height="200" rx="10" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.2"/>
<text x="60" y="590" font-size="16" fill="#b86e00" font-weight="700">Design rules for EEPROM storage</text>
<text x="60" y="618" font-size="14">Write only when a value changes: each cell has a limited number of write cycles.</text>
<text x="60" y="644" font-size="14">Disable interrupts around a write so the required unlock sequence is not broken.</text>
<text x="60" y="670" font-size="14">Read back after every write to confirm the byte was stored.</text>
<text x="60" y="696" font-size="14">Keep a checksum so corrupted data is detected at start-up instead of being used.</text>
<text x="60" y="722" font-size="14">Values wider than 8 bits are split into bytes and stored at consecutive addresses.</text>
<text x="1160" y="784" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Embedded EEPROM Data Storage &amp; Retrieval System</text>
</svg>