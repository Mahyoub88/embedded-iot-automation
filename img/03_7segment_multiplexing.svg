<rect width="1200" height="870" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Multiplexed 7-segment display</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Four digits share one segment bus; Timer0 lights them one at a time faster than the eye can follow</text>
<rect x="40" y="120" width="200" height="260" rx="10" fill="#e8eef6" stroke="#1f3a5f" stroke-width="2"/>
<text x="140" y="150" font-size="17" fill="#1f3a5f" font-weight="700" text-anchor="middle">PIC16</text>
<text x="140" y="180" font-size="12" text-anchor="middle">PORTB: segments a–g, dp</text>
<text x="140" y="200" font-size="12" text-anchor="middle">PORTA/D: digit enables</text>
<text x="140" y="240" font-size="13" fill="#1f3a5f" font-weight="700" text-anchor="middle">Timer0 ISR</text>
<text x="140" y="260" font-size="12" text-anchor="middle">every tick:</text>
<text x="140" y="278" font-size="12" text-anchor="middle">1. blank all digits</text>
<text x="140" y="296" font-size="12" text-anchor="middle">2. write next pattern</text>
<text x="140" y="314" font-size="12" text-anchor="middle">3. enable next digit</text>
<line x1="240" y1="170" x2="1010" y2="170" stroke="#1f3a5f" stroke-width="5"/>
<text x="620" y="160" font-size="12.5" fill="#1f3a5f" font-weight="600" text-anchor="middle">shared segment bus (8 lines, through resistors)</text>
