<text x="320" y="772" font-size="13" fill="#b86e00" font-weight="600" text-anchor="middle">one full frame = 4 ticks</text>
<text x="40" y="810" font-size="13.5">Example: Timer0 overflow every ≈ 4 ms → frame ≈ 16 ms → ≈ 60 Hz refresh, no visible flicker.</text>
<text x="40" y="832" font-size="13.5" fill="#5b6b7c">Each digit is lit 1/4 of the time, so segment current is set higher than for a static display.</text>
