<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 832" width="1200" height="832" fill="#1d2733" role="img" aria-label="Reading the DS1307 real-time clock over I²C">
<title>Reading the DS1307 real-time clock over I²C</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker><marker id="k1d2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="1200" height="832" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Reading the DS1307 real-time clock over I²C</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Two wires, one address, BCD registers: how the firmware gets the time</text>
<rect x="40" y="120" width="180" height="120" rx="10" fill="#e8eef6" stroke="#1f3a5f" stroke-width="2"/>
<text x="130" y="160" font-size="16" fill="#1f3a5f" font-weight="700" text-anchor="middle">PIC16</text>
<text x="130" y="184" font-size="13" text-anchor="middle">I²C master</text>
<text x="130" y="204" font-size="12" fill="#5b6b7c" text-anchor="middle">SCL = RC3, SDA = RC4</text>
<rect x="560" y="120" width="200" height="120" rx="10" fill="#e3f3f4" stroke="#0b7a83" stroke-width="2"/>
<text x="660" y="160" font-size="16" fill="#0b7a83" font-weight="700" text-anchor="middle">DS1307</text>
<text x="660" y="184" font-size="13" text-anchor="middle">slave 0x68</text>
<text x="660" y="204" font-size="12" fill="#5b6b7c" text-anchor="middle">32.768 kHz crystal</text>
<line x1="220" y1="160" x2="560" y2="160" stroke="#1f3a5f" stroke-width="2.4"/>
<line x1="220" y1="200" x2="560" y2="200" stroke="#0b7a83" stroke-width="2.4"/>
<text x="390" y="152" font-size="12.5" fill="#1f3a5f" font-weight="600" text-anchor="middle">SCL (clock)</text>
<text x="390" y="192" font-size="12.5" fill="#0b7a83" font-weight="600" text-anchor="middle">SDA (data)</text>
<line x1="300" y1="160" x2="300" y2="110" stroke="#5b6b7c" stroke-width="1.4"/>
<line x1="340" y1="200" x2="340" y2="110" stroke="#5b6b7c" stroke-width="1.4"/>
<text x="320" y="104" font-size="12" fill="#5b6b7c" text-anchor="middle">pull-ups to 5 V</text>
<rect x="800" y="120" width="360" height="120" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="818" y="148" font-size="13">Open-drain bus: devices only pull low,</text>
<text x="818" y="169" font-size="13">resistors pull high. 100 kHz standard mode.</text>
<text x="818" y="190" font-size="13">A coin cell keeps the clock running and the</text>
<text x="818" y="211" font-size="13">56-byte RAM alive when main power is off.</text>
<text x="40" y="290" font-size="16" fill="#1f3a5f" font-weight="700">Transaction: set the register pointer, then read seconds, minutes, hours</text>
<rect x="40" y="310" width="40" height="44" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="60" y="338" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="middle">S</text>
<rect x="84" y="310" width="80" height="44" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="124" y="338" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="middle">0xD0</text>
<rect x="168" y="310" width="40" height="44" rx="4" fill="#e6f3ea" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="188" y="338" font-size="14" fill="#2e7d4f" font-weight="700" text-anchor="middle">A</text>
<rect x="212" y="310" width="80" height="44" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="252" y="338" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="middle">0x00</text>
<rect x="296" y="310" width="40" height="44" rx="4" fill="#e6f3ea" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="316" y="338" font-size="14" fill="#2e7d4f" font-weight="700" text-anchor="middle">A</text>
<rect x="340" y="310" width="44" height="44" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="362" y="338" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="middle">Sr</text>
<rect x="388" y="310" width="80" height="44" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="428" y="338" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="middle">0xD1</text>
<rect x="472" y="310" width="40" height="44" rx="4" fill="#e6f3ea" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="492" y="338" font-size="14" fill="#2e7d4f" font-weight="700" text-anchor="middle">A</text>
<rect x="516" y="310" width="76" height="44" rx="4" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="554" y="338" font-size="14" fill="#0b7a83" font-weight="700" text-anchor="middle">sec</text>
<rect x="596" y="310" width="40" height="44" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="616" y="338" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="middle">A</text>
<rect x="640" y="310" width="76" height="44" rx="4" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="678" y="338" font-size="14" fill="#0b7a83" font-weight="700" text-anchor="middle">min</text>
<rect x="720" y="310" width="40" height="44" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="740" y="338" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="middle">A</text>
<rect x="764" y="310" width="76" height="44" rx="4" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="802" y="338" font-size="14" fill="#0b7a83" font-weight="700" text-anchor="middle">hour</text>
<rect x="844" y="310" width="40" height="44" rx="4" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.5"/>
<text x="864" y="338" font-size="14" fill="#b86e00" font-weight="700" text-anchor="middle">N</text>
<rect x="888" y="310" width="40" height="44" rx="4" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="908" y="338" font-size="14" fill="#1f3a5f" font-weight="700" text-anchor="middle">P</text>
<text x="40" y="384" font-size="13.5">S / Sr / P: start, repeated start, stop.   0xD0 = address 0x68 + write.   0xD1 = address 0x68 + read.</text>
<text x="40" y="406" font-size="13.5">A: acknowledge (green from the RTC, navy from the PIC).   N: the PIC does not acknowledge the last byte, ending the read.</text>
<text x="40" y="436" font-size="13.5" fill="#5b6b7c">White: driven by the PIC.   Teal: data driven by the DS1307.</text>
<text x="40" y="490" font-size="16" fill="#1f3a5f" font-weight="700">DS1307 register map</text>
<rect x="40" y="505" width="360" height="50" rx="6" fill="#ffffff" stroke="#0b7a83" stroke-width="1.3"/>
<text x="54" y="536" font-size="14" fill="#0b7a83" font-weight="700" class="m">00h</text>
<text x="140" y="536" font-size="14" font-weight="700">Seconds</text>
<text x="386" y="536" font-size="12.5" fill="#5b6b7c" text-anchor="end">CH | 10 s | s</text>
<rect x="415" y="505" width="360" height="50" rx="6" fill="#ffffff" stroke="#0b7a83" stroke-width="1.3"/>
<text x="429" y="536" font-size="14" fill="#0b7a83" font-weight="700" class="m">01h</text>
<text x="515" y="536" font-size="14" font-weight="700">Minutes</text>
<text x="761" y="536" font-size="12.5" fill="#5b6b7c" text-anchor="end">0 | 10 min | min</text>
<rect x="790" y="505" width="360" height="50" rx="6" fill="#ffffff" stroke="#0b7a83" stroke-width="1.3"/>
<text x="804" y="536" font-size="14" fill="#0b7a83" font-weight="700" class="m">02h</text>
<text x="890" y="536" font-size="14" font-weight="700">Hours</text>
<text x="1136" y="536" font-size="12.5" fill="#5b6b7c" text-anchor="end">12/24 | 10 h | h</text>
<rect x="40" y="565" width="360" height="50" rx="6" fill="#ffffff" stroke="#0b7a83" stroke-width="1.3"/>
<text x="54" y="596" font-size="14" fill="#0b7a83" font-weight="700" class="m">03h</text>
<text x="140" y="596" font-size="14" font-weight="700">Day</text>
<text x="386" y="596" font-size="12.5" fill="#5b6b7c" text-anchor="end">1–7</text>
<rect x="415" y="565" width="360" height="50" rx="6" fill="#ffffff" stroke="#0b7a83" stroke-width="1.3"/>
<text x="429" y="596" font-size="14" fill="#0b7a83" font-weight="700" class="m">04h</text>
<text x="515" y="596" font-size="14" font-weight="700">Date</text>
<text x="761" y="596" font-size="12.5" fill="#5b6b7c" text-anchor="end">10 date | date</text>
<rect x="790" y="565" width="360" height="50" rx="6" fill="#ffffff" stroke="#0b7a83" stroke-width="1.3"/>
<text x="804" y="596" font-size="14" fill="#0b7a83" font-weight="700" class="m">05h</text>
<text x="890" y="596" font-size="14" font-weight="700">Month</text>
<text x="1136" y="596" font-size="12.5" fill="#5b6b7c" text-anchor="end">10 mo | mo</text>
<rect x="40" y="625" width="360" height="50" rx="6" fill="#ffffff" stroke="#0b7a83" stroke-width="1.3"/>
<text x="54" y="656" font-size="14" fill="#0b7a83" font-weight="700" class="m">06h</text>
<text x="140" y="656" font-size="14" font-weight="700">Year</text>
<text x="386" y="656" font-size="12.5" fill="#5b6b7c" text-anchor="end">10 yr | yr</text>
<rect x="415" y="625" width="360" height="50" rx="6" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.3"/>
<text x="429" y="656" font-size="14" fill="#0b7a83" font-weight="700" class="m">07h</text>
<text x="515" y="656" font-size="14" font-weight="700">Control</text>
<text x="761" y="656" font-size="12.5" fill="#5b6b7c" text-anchor="end">SQW out</text>
<rect x="790" y="625" width="360" height="50" rx="6" fill="#ffffff" stroke="#5b6b7c" stroke-width="1.3"/>
<text x="804" y="656" font-size="14" fill="#0b7a83" font-weight="700" class="m">08h–3Fh</text>
<text x="890" y="656" font-size="14" font-weight="700">RAM</text>
<text x="1136" y="656" font-size="12.5" fill="#5b6b7c" text-anchor="end">56 bytes, battery-backed</text>
<rect x="40" y="700" width="1120" height="90" rx="10" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.2"/>
<text x="60" y="728" font-size="15" fill="#b86e00" font-weight="700">BCD in, BCD out</text>
<text x="60" y="752" font-size="14">0x45 in the seconds register means 45 s: tens = 0x45 &gt;&gt; 4 = 4, units = 0x45 &amp; 0x0F = 5.</text>
<text x="60" y="774" font-size="14">Bit 7 of seconds (CH) halts the oscillator; firmware clears it once when the clock is first set.</text>
<text x="1160" y="816" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Embedded Systems, IoT &amp; Industrial Automation</text>
</svg>