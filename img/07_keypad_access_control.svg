<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 830" width="1200" height="830" fill="#1d2733" role="img" aria-label="Keypad and LCD access control">
<title>Keypad and LCD access control</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker><marker id="k1d2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="1200" height="830" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Keypad and LCD access control</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Code entry, check against the stored code, and the alarm on wrong attempts</text>
<rect x="40" y="120" width="400" height="370" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="150" font-size="15" fill="#1f3a5f" font-weight="700">Keypad matrix scan (4 × 4)</text>
<rect x="150" y="180" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="175" y="212" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">1</text>
<rect x="212" y="180" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="237" y="212" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">2</text>
<rect x="274" y="180" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="299" y="212" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">3</text>
<rect x="336" y="180" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="361" y="212" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">A</text>
<rect x="150" y="242" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="175" y="274" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">4</text>
<rect x="212" y="242" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="237" y="274" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">5</text>
<rect x="274" y="242" width="50" height="50" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="299" y="274" font-size="16" fill="#0b7a83" font-weight="700" text-anchor="middle">6</text>
<rect x="336" y="242" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="361" y="274" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">B</text>
<rect x="150" y="304" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="175" y="336" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">7</text>
<rect x="212" y="304" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="237" y="336" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">8</text>
<rect x="274" y="304" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="299" y="336" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">9</text>
<rect x="336" y="304" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="361" y="336" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">C</text>
<rect x="150" y="366" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="175" y="398" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">*</text>
<rect x="212" y="366" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="237" y="398" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">0</text>
<rect x="274" y="366" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="299" y="398" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">#</text>
<rect x="336" y="366" width="50" height="50" rx="8" fill="#ffffff" stroke="#9aa8b6" stroke-width="1"/>
<text x="361" y="398" font-size="16" fill="#1d2733" font-weight="700" text-anchor="middle">D</text>
<text x="140" y="210" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="end">R1</text>
<text x="140" y="272" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="end">R2</text>
<text x="140" y="334" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="end">R3</text>
<text x="140" y="396" font-size="12.5" fill="#1f3a5f" font-weight="700" text-anchor="end">R4</text>
<text x="175" y="440" font-size="12.5" fill="#0b7a83" font-weight="700" text-anchor="middle">C1</text>
<text x="237" y="440" font-size="12.5" fill="#0b7a83" font-weight="700" text-anchor="middle">C2</text>
<text x="299" y="440" font-size="12.5" fill="#0b7a83" font-weight="700" text-anchor="middle">C3</text>
<text x="361" y="440" font-size="12.5" fill="#0b7a83" font-weight="700" text-anchor="middle">C4</text>
<text x="60" y="462" font-size="12.5">Drive one row low at a time, read the columns:</text>
<text x="60" y="480" font-size="12.5" fill="#5b6b7c">R2 low + C3 reads low → key “6”. Debounce, e.g. 20 ms.</text>
<rect x="500" y="130" width="280" height="76" rx="8" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="640" y="161.8" font-size="15" fill="#1f3a5f" font-weight="700" text-anchor="middle">Idle</text>
<text x="640" y="185.4" font-size="12.5" text-anchor="middle">LCD: “Enter code”</text>
<rect x="860" y="130" width="300" height="76" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.5"/>
<text x="1010" y="161.8" font-size="15" fill="#0b7a83" font-weight="700" text-anchor="middle">Entering code</text>
<text x="1010" y="185.4" font-size="12.5" text-anchor="middle">each key shown as *</text>
<rect x="860" y="300" width="300" height="76" rx="8" fill="#ffffff" stroke="#1f3a5f" stroke-width="1.5"/>
<text x="1010" y="331.8" font-size="15" fill="#1f3a5f" font-weight="700" text-anchor="middle">Check</text>
<text x="1010" y="355.4" font-size="12.5" text-anchor="middle">compare with code in EEPROM</text>
<rect x="500" y="300" width="280" height="76" rx="8" fill="#e6f3ea" stroke="#2e7d4f" stroke-width="1.5"/>
<text x="640" y="323.4" font-size="15" fill="#2e7d4f" font-weight="700" text-anchor="middle">Access granted</text>
<text x="640" y="347" font-size="12.5" text-anchor="middle">relay opens the lock for a</text>
<text x="640" y="363.9" font-size="12.5" text-anchor="middle">set time, then relocks</text>
<rect x="860" y="470" width="300" height="76" rx="8" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.5"/>
<text x="1010" y="501.8" font-size="15" fill="#b86e00" font-weight="700" text-anchor="middle">Access denied</text>
<text x="1010" y="525.4" font-size="12.5" text-anchor="middle">count the failed attempt</text>
<rect x="500" y="470" width="280" height="76" rx="8" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.5"/>
<text x="640" y="493.4" font-size="15" fill="#b3261e" font-weight="700" text-anchor="middle">Alarm</text>
<text x="640" y="517" font-size="12.5" text-anchor="middle">buzzer on, keypad locked</text>
<text x="640" y="533.9" font-size="12.5" text-anchor="middle">until reset</text>
<line x1="782" y1="168" x2="856" y2="168" stroke="#0b7a83" stroke-width="2" marker-end="url(#k0b7a83)"/>
<text x="819" y="160" font-size="13" fill="#0b7a83" font-weight="600" text-anchor="middle">key</text>
<path d="M 1060 130 C 1060 96, 1140 96, 1140 126" fill="none" stroke="#0b7a83" stroke-width="1.6" marker-end="url(#k0b7a83)"/>
<text x="1100" y="92" font-size="12" fill="#0b7a83" font-weight="600" text-anchor="middle">more keys</text>
<line x1="1010" y1="208" x2="1010" y2="296" stroke="#1f3a5f" stroke-width="2" marker-end="url(#k1f3a5f)"/>
<text x="1022" y="256" font-size="13" fill="#1f3a5f" font-weight="600">#</text>
<line x1="856" y1="338" x2="784" y2="338" stroke="#2e7d4f" stroke-width="2" marker-end="url(#k2e7d4f)"/>
<text x="820" y="330" font-size="13" fill="#2e7d4f" font-weight="600" text-anchor="middle">match</text>
<path d="M 640 300 V 210" fill="none" stroke="#2e7d4f" stroke-width="1.8" stroke-dasharray="6 4" marker-end="url(#k2e7d4f)"/>
<text x="650" y="258" font-size="12" fill="#2e7d4f" font-weight="600">timeout</text>
<line x1="1010" y1="378" x2="1010" y2="466" stroke="#b86e00" stroke-width="2" marker-end="url(#kb86e00)"/>
<text x="1022" y="426" font-size="13" fill="#b86e00" font-weight="600">no match</text>
<path d="M 1160 508 H 1175 V 168 H 1162" fill="none" stroke="#b86e00" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#kb86e00)"/>
<text x="1135" y="258" font-size="12.5" fill="#b86e00" font-weight="600" text-anchor="middle">retry</text>
<line x1="856" y1="508" x2="784" y2="508" stroke="#b3261e" stroke-width="2" marker-end="url(#kb3261e)"/>
<text x="820" y="500" font-size="13" fill="#b3261e" font-weight="600" text-anchor="middle">limit</text>
<rect x="40" y="600" width="1120" height="190" rx="10" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="630" font-size="16" fill="#1f3a5f" font-weight="700">Design points</text>
<text x="60" y="658" font-size="14">The code lives in data EEPROM, so it survives power loss and is not hard-coded in the program.</text>
<text x="60" y="686" font-size="14">Key presses are debounced in firmware; one physical press must give exactly one digit.</text>
<text x="60" y="714" font-size="14">The LCD never shows the digits typed, only *, so the code cannot be read over a shoulder.</text>
<text x="60" y="742" font-size="14">The relay is driven through a transistor with a flyback diode, never straight from the MCU pin.</text>
<text x="60" y="770" font-size="14">After a set number of failed attempts the alarm sounds, and it is left only through an explicit reset.</text>
<text x="1160" y="814" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Embedded Systems, IoT &amp; Industrial Automation</text>
</svg>