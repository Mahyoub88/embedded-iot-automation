<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 772" width="1200" height="772" fill="#1d2733" role="img" aria-label="Expanding outputs with 74HC595 shift registers">
<title>Expanding outputs with 74HC595 shift registers</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker><marker id="k1d2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="1200" height="772" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Expanding outputs with 74HC595 shift registers</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">Three MCU pins drive 8, 16 or more outputs: shift the bits in, then latch them all at once</text>
<rect x="40" y="130" width="180" height="200" rx="10" fill="#e8eef6" stroke="#1f3a5f" stroke-width="2"/>
<text x="130" y="165" font-size="16" fill="#1f3a5f" font-weight="700" text-anchor="middle">PIC16</text>
<text x="60" y="205" font-size="13.5" fill="#1f3a5f" font-weight="700">DATA</text>
<text x="200" y="205" font-size="12.5" fill="#5b6b7c" text-anchor="end">→ SER</text>
<text x="60" y="241" font-size="13.5" fill="#1f3a5f" font-weight="700">CLOCK</text>
<text x="200" y="241" font-size="12.5" fill="#5b6b7c" text-anchor="end">→ SRCLK</text>
<text x="60" y="277" font-size="13.5" fill="#1f3a5f" font-weight="700">LATCH</text>
<text x="200" y="277" font-size="12.5" fill="#5b6b7c" text-anchor="end">→ RCLK</text>
<rect x="300" y="130" width="300" height="200" rx="10" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="450" y="160" font-size="15" fill="#b86e00" font-weight="700" text-anchor="middle">74HC595 #1  (outputs 0–7)</text>
<text x="450" y="180" font-size="11.5" fill="#5b6b7c" text-anchor="middle">8-bit shift register + 8-bit storage latch</text>
<rect x="320" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="334" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q0</text>
<rect x="353" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="367" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q1</text>
<rect x="386" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="400" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q2</text>
<rect x="419" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="433" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q3</text>
<rect x="452" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="466" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q4</text>
<rect x="485" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="499" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q5</text>
<rect x="518" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="532" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q6</text>
<rect x="551" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="565" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q7</text>
<text x="450" y="260" font-size="12" text-anchor="middle" class="m">SER  SRCLK  RCLK  /OE  /SRCLR</text>
<text x="450" y="300" font-size="12" fill="#5b6b7c" text-anchor="middle">QH′ → serial out to next chip</text>
<line x1="334" y1="330" x2="334" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="334" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="367" y1="330" x2="367" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="367" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="400" y1="330" x2="400" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="400" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="433" y1="330" x2="433" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="433" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="466" y1="330" x2="466" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="466" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="499" y1="330" x2="499" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="499" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="532" y1="330" x2="532" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="532" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="565" y1="330" x2="565" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="565" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<rect x="720" y="130" width="300" height="200" rx="10" fill="#ffffff" stroke="#b86e00" stroke-width="2"/>
<text x="870" y="160" font-size="15" fill="#b86e00" font-weight="700" text-anchor="middle">74HC595 #2  (outputs 8–15)</text>
<text x="870" y="180" font-size="11.5" fill="#5b6b7c" text-anchor="middle">8-bit shift register + 8-bit storage latch</text>
<rect x="740" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="754" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q0</text>
<rect x="773" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="787" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q1</text>
<rect x="806" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="820" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q2</text>
<rect x="839" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="853" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q3</text>
<rect x="872" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="886" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q4</text>
<rect x="905" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="919" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q5</text>
<rect x="938" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="952" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q6</text>
<rect x="971" y="200" width="28" height="34" rx="3" fill="#fbf1e1" stroke="#b86e00" stroke-width="1"/>
<text x="985" y="222" font-size="11" fill="#b86e00" font-weight="700" text-anchor="middle">Q7</text>
<text x="870" y="260" font-size="12" text-anchor="middle" class="m">SER  SRCLK  RCLK  /OE  /SRCLR</text>
<text x="870" y="300" font-size="12" fill="#5b6b7c" text-anchor="middle">QH′ → serial out to next chip</text>
<line x1="754" y1="330" x2="754" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="754" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="787" y1="330" x2="787" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="787" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="820" y1="330" x2="820" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="820" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="853" y1="330" x2="853" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="853" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="886" y1="330" x2="886" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="886" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="919" y1="330" x2="919" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="919" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="952" y1="330" x2="952" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="952" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="985" y1="330" x2="985" y2="372" stroke="#b86e00" stroke-width="1.6"/>
<circle cx="985" cy="380" r="7" fill="#fbe9e7" stroke="#b3261e" stroke-width="1.4"/>
<line x1="222" y1="250" x2="296" y2="250" stroke="#1f3a5f" stroke-width="2" marker-end="url(#k1f3a5f)"/>
<line x1="602" y1="296" x2="716" y2="296" stroke="#b86e00" stroke-width="2" marker-end="url(#kb86e00)"/>
<text x="659" y="288" font-size="13" fill="#b86e00" font-weight="600" text-anchor="middle">QH′ → SER</text>
<path d="M 260 220 H 280 V 112 H 870 V 126" fill="none" stroke="#1f3a5f" stroke-width="1.4" stroke-dasharray="4 4" marker-end="url(#k1f3a5f)"/>
<text x="560" y="106" font-size="12" fill="#1f3a5f" font-weight="600" text-anchor="middle">CLOCK and LATCH go to every chip in parallel</text>
<text x="600" y="408" font-size="13" fill="#b3261e" font-weight="600" text-anchor="middle">LEDs, relay drivers or display segments</text>
<text x="40" y="460" font-size="16" fill="#1f3a5f" font-weight="700">Timing for one byte (0b10110010, MSB first)</text>
<text x="185" y="512" font-size="13.5" fill="#0b7a83" font-weight="600" text-anchor="end">SER (data)</text>
<text x="250" y="512" font-size="13" fill="#0b7a83" font-weight="700" text-anchor="middle">1</text>
<text x="350" y="512" font-size="13" fill="#0b7a83" font-weight="700" text-anchor="middle">0</text>
<text x="450" y="512" font-size="13" fill="#0b7a83" font-weight="700" text-anchor="middle">1</text>
<text x="550" y="512" font-size="13" fill="#0b7a83" font-weight="700" text-anchor="middle">1</text>
<text x="650" y="512" font-size="13" fill="#0b7a83" font-weight="700" text-anchor="middle">0</text>
<text x="750" y="512" font-size="13" fill="#0b7a83" font-weight="700" text-anchor="middle">0</text>
<text x="850" y="512" font-size="13" fill="#0b7a83" font-weight="700" text-anchor="middle">1</text>
<text x="950" y="512" font-size="13" fill="#0b7a83" font-weight="700" text-anchor="middle">0</text>
<polyline points="200,494 300,494 300,522 400,522 400,494 500,494 500,494 600,494 600,522 700,522 700,522 800,522 800,494 900,494 900,522 1000,522" fill="none" stroke="#0b7a83" stroke-width="2"/>
<text x="185" y="572" font-size="13.5" fill="#1f3a5f" font-weight="600" text-anchor="end">SRCLK</text>
<polyline points="200,582 250,582 250,554 275,554 275,582 300,582 300,582 350,582 350,554 375,554 375,582 400,582 400,582 450,582 450,554 475,554 475,582 500,582 500,582 550,582 550,554 575,554 575,582 600,582 600,582 650,582 650,554 675,554 675,582 700,582 700,582 750,582 750,554 775,554 775,582 800,582 800,582 850,582 850,554 875,554 875,582 900,582 900,582 950,582 950,554 975,554 975,582 1000,582" fill="none" stroke="#1f3a5f" stroke-width="2"/>
<text x="185" y="632" font-size="13.5" fill="#b86e00" font-weight="600" text-anchor="end">RCLK (latch)</text>
<polyline points="200,642 1010,642 1010,614 1040,614 1040,642 1060,642" fill="none" stroke="#b86e00" stroke-width="2"/>
<text x="600" y="682" font-size="13" fill="#1f3a5f" font-weight="500" text-anchor="middle">each SRCLK rising edge shifts SER into Q0 and moves every bit along one place</text>
<text x="1025" y="682" font-size="13" fill="#b86e00" font-weight="600" text-anchor="middle">outputs update together</text>
<text x="40" y="724" font-size="13.5" fill="#5b6b7c">Because the latch updates only on RCLK, the outputs never show the half-shifted pattern, so LEDs and relays do not glitch.</text>
<text x="1160" y="756" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Embedded Systems, IoT &amp; Industrial Automation</text>
</svg>