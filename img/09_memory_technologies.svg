<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 790" width="1200" height="790" fill="#1d2733" role="img" aria-label="Memory technologies used in embedded systems">
<title>Memory technologies used in embedded systems</title>
<defs><style>text{font-family:'Segoe UI', Helvetica, Arial, 'Liberation Sans', sans-serif}.m{font-family:Consolas, 'DejaVu Sans Mono', monospace}</style><marker id="k1f3a5f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f3a5f"/></marker><marker id="k0b7a83" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#0b7a83"/></marker><marker id="kb86e00" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b86e00"/></marker><marker id="kb3261e" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#b3261e"/></marker><marker id="k2e7d4f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2e7d4f"/></marker><marker id="k5b6b7c" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#5b6b7c"/></marker><marker id="k1d2733" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1d2733"/></marker></defs>
<rect width="1200" height="790" fill="#ffffff"/>
<rect x="0" y="0" width="1200" height="6" fill="#1f3a5f"/>
<text x="40" y="52" font-size="26" font-weight="700">Memory technologies used in embedded systems</text>
<text x="40" y="80" font-size="15" fill="#5b6b7c">What keeps data without power, how each type is erased, and where it ends up on a board</text>
<rect x="40" y="120" width="1120" height="46" rx="8" fill="#e8eef6" stroke="#1f3a5f" stroke-width="1.6"/>
<text x="600" y="150" font-size="17" fill="#1f3a5f" font-weight="700" text-anchor="middle">Semiconductor memory</text>
<rect x="40" y="190" width="740" height="40" rx="8" fill="#e3f3f4" stroke="#0b7a83" stroke-width="1.4"/>
<text x="410" y="216" font-size="15" fill="#0b7a83" font-weight="700" text-anchor="middle">Non-volatile: keeps data without power</text>
<rect x="800" y="190" width="360" height="40" rx="8" fill="#fbf1e1" stroke="#b86e00" stroke-width="1.4"/>
<text x="980" y="216" font-size="15" fill="#b86e00" font-weight="700" text-anchor="middle">Volatile: lost at power-off</text>
<rect x="40" y="250" width="140" height="120" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="110" y="296.4" font-size="16" fill="#0b7a83" font-weight="700" text-anchor="middle">ROM</text>
<text x="110" y="319.4" font-size="12" text-anchor="middle">set at the</text>
<text x="110" y="335.6" font-size="12" text-anchor="middle">factory, fixed</text>
<rect x="190" y="250" width="140" height="120" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="260" y="296.4" font-size="16" fill="#0b7a83" font-weight="700" text-anchor="middle">PROM</text>
<text x="260" y="319.4" font-size="12" text-anchor="middle">one-time</text>
<text x="260" y="335.6" font-size="12" text-anchor="middle">programmable</text>
<rect x="340" y="250" width="140" height="120" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="410" y="296.4" font-size="16" fill="#0b7a83" font-weight="700" text-anchor="middle">EPROM</text>
<text x="410" y="319.4" font-size="12" text-anchor="middle">erased by UV</text>
<text x="410" y="335.6" font-size="12" text-anchor="middle">through a window</text>
<rect x="490" y="250" width="140" height="120" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="560" y="296.4" font-size="16" fill="#0b7a83" font-weight="700" text-anchor="middle">EEPROM</text>
<text x="560" y="319.4" font-size="12" text-anchor="middle">electrically</text>
<text x="560" y="335.6" font-size="12" text-anchor="middle">erased byte by byte</text>
<rect x="640" y="250" width="140" height="120" rx="8" fill="#ffffff" stroke="#0b7a83" stroke-width="1.5"/>
<text x="710" y="296.4" font-size="16" fill="#0b7a83" font-weight="700" text-anchor="middle">Flash</text>
<text x="710" y="319.4" font-size="12" text-anchor="middle">electrically</text>
<text x="710" y="335.6" font-size="12" text-anchor="middle">erased in blocks</text>
<rect x="800" y="250" width="175" height="120" rx="8" fill="#ffffff" stroke="#b86e00" stroke-width="1.5"/>
<text x="887.5" y="296.4" font-size="16" fill="#b86e00" font-weight="700" text-anchor="middle">SRAM</text>
<text x="887.5" y="319.4" font-size="12" text-anchor="middle">flip-flop cells,</text>
<text x="887.5" y="335.6" font-size="12" text-anchor="middle">fast, no refresh</text>
<rect x="985" y="250" width="175" height="120" rx="8" fill="#ffffff" stroke="#b86e00" stroke-width="1.5"/>
<text x="1072.5" y="296.4" font-size="16" fill="#b86e00" font-weight="700" text-anchor="middle">DRAM</text>
<text x="1072.5" y="319.4" font-size="12" text-anchor="middle">capacitor cells,</text>
<text x="1072.5" y="335.6" font-size="12" text-anchor="middle">needs refresh</text>
<rect x="800" y="390" width="360" height="70" rx="8" fill="#f6f8fb" stroke="#5b6b7c" stroke-width="1.5"/>
<text x="980" y="418.8" font-size="15" fill="#5b6b7c" font-weight="700" text-anchor="middle">NV-RAM</text>
<text x="980" y="442.4" font-size="12.5" text-anchor="middle">SRAM kept alive by a battery (e.g. DS1307 RAM)</text>
<line x1="60" y1="395" x2="760" y2="395" stroke="#0b7a83" stroke-width="2" marker-end="url(#k0b7a83)"/>
<text x="410" y="386" font-size="13" fill="#0b7a83" font-weight="600" text-anchor="middle">easier to rewrite, in-circuit, more times</text>
<text x="40" y="500" font-size="16" fill="#1f3a5f" font-weight="700">Where each type sits on a PIC16 project</text>
<rect x="40" y="518" width="1120" height="42" rx="6" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="545" font-size="14" fill="#1f3a5f" font-weight="700">Program memory</text>
<rect x="250" y="527" width="96" height="24" rx="12" fill="#ffffff" stroke="#0b7a83" stroke-width="1.2"/>
<text x="298" y="544" font-size="12.5" fill="#0b7a83" font-weight="700" text-anchor="middle">Flash</text>
<text x="380" y="545" font-size="14">firmware (HEX), written by the programmer or over ICSP</text>
<rect x="40" y="568" width="1120" height="42" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="595" font-size="14" fill="#1f3a5f" font-weight="700">Data EEPROM</text>
<rect x="250" y="577" width="96" height="24" rx="12" fill="#ffffff" stroke="#0b7a83" stroke-width="1.2"/>
<text x="298" y="594" font-size="12.5" fill="#0b7a83" font-weight="700" text-anchor="middle">EEPROM</text>
<text x="380" y="595" font-size="14">access code, settings, last values: survives power loss</text>
<rect x="40" y="618" width="1120" height="42" rx="6" fill="#f6f8fb" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="645" font-size="14" fill="#1f3a5f" font-weight="700">RAM</text>
<rect x="250" y="627" width="96" height="24" rx="12" fill="#ffffff" stroke="#b86e00" stroke-width="1.2"/>
<text x="298" y="644" font-size="12.5" fill="#b86e00" font-weight="700" text-anchor="middle">SRAM</text>
<text x="380" y="645" font-size="14">variables, stack, working data: lost at reset</text>
<rect x="40" y="668" width="1120" height="42" rx="6" fill="#ffffff" stroke="#d5dde6" stroke-width="1"/>
<text x="60" y="695" font-size="14" fill="#1f3a5f" font-weight="700">RTC RAM</text>
<rect x="250" y="677" width="96" height="24" rx="12" fill="#ffffff" stroke="#0b7a83" stroke-width="1.2"/>
<text x="298" y="694" font-size="12.5" fill="#0b7a83" font-weight="700" text-anchor="middle">NV-RAM</text>
<text x="380" y="695" font-size="14">56 bytes in the DS1307, kept by its coin cell</text>
<text x="40" y="744" font-size="13" fill="#5b6b7c">Device programming: the programmer writes Flash and EEPROM, then sets the configuration bits (oscillator, watchdog, code protection).</text>
<text x="1160" y="774" font-size="12" fill="#5b6b7c" text-anchor="end">Mohammed Mahyoub, Embedded Systems, IoT &amp; Industrial Automation</text>
</svg>