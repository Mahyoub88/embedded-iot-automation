<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1240 660" role="img" aria-labelledby="t d"><title id="t">EEPROM integrity: proposed record lifecycle, not recovered firmware</title><desc id="d">Project-specific explanatory diagram. Not an as-built schematic or new test result.</desc><defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="3" orient="auto-start-reverse"><path d="M0 0 L7 3 L0 6" fill="#5b9dff"/></marker></defs><rect width="1240" height="660" rx="18" fill="#0a0e18"/><g font-family="Arial,sans-serif"><text x="40" y="48" fill="#5b9dff" font-size="17">ENGINEERING EXPLANATION</text><text x="40" y="91" fill="#f5f7fb" font-size="29">EEPROM integrity: proposed record lifecycle, not recovered firmware</text><rect x="40" y="170" width="240" height="100" rx="12" fill="#121828" stroke="#5b9dff"/><text x="56" y="208" fill="#f5f7fb" font-size="22">Validate input</text><text x="56" y="239" fill="#b7c0d4" font-size="17">Range / changed value</text><rect x="355" y="170" width="240" height="100" rx="12" fill="#121828" stroke="#5b9dff"/><text x="371" y="208" fill="#f5f7fb" font-size="22">Write payload</text><text x="371" y="239" fill="#b7c0d4" font-size="17">Selected PIC rules</text><rect x="670" y="170" width="240" height="100" rx="12" fill="#121828" stroke="#5b9dff"/><text x="686" y="208" fill="#f5f7fb" font-size="22">Read back</text><text x="686" y="239" fill="#b7c0d4" font-size="17">Compare bytes</text><path d="M280 220 L355 220" fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><path d="M595 220 L670 220" fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><rect x="670" y="385" width="240" height="100" rx="12" fill="#121828" stroke="#5b9dff"/><text x="686" y="423" fill="#f5f7fb" font-size="22">Boot / restore</text><text x="686" y="454" fill="#b7c0d4" font-size="17">Validate record</text><path d="M790 270 L790 385" fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><text x="770" y="315.5" fill="#5b9dff" font-size="17">restart</text><rect x="355" y="385" width="240" height="100" rx="12" fill="#121828" stroke="#5b9dff"/><text x="371" y="423" fill="#f5f7fb" font-size="22">Valid record</text><text x="371" y="454" fill="#b7c0d4" font-size="17">Use stored value</text><path d="M670 435 L595 435" fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><rect x="995" y="385" width="210" height="100" rx="12" fill="#121828" stroke="#5b9dff"/><text x="1011" y="423" fill="#f5f7fb" font-size="22">Invalid record</text><text x="1011" y="454" fill="#b7c0d4" font-size="17">Defined fallback</text><path d="M910 435 L995 435" fill="none" stroke="#5b9dff" stroke-width="3"  marker-end="url(#a)"/><text x="40" y="330" fill="#fbbf24" font-size="22">Reference multi-byte record design</text><text x="40" y="545" fill="#f5f7fb" font-size="23">Version | payload bytes | checksum | commit indicator</text><text x="40" y="580" fill="#b7c0d4" font-size="20">A byte read-back does not prove atomicity under power interruption.</text><text x="40" y="624" fill="#b7c0d4" font-size="17">Authored documentation visual · Illustrative review model, not original implementation evidence</text></g></svg>